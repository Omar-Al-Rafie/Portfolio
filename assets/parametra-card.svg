<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#08080c"/>
      <stop offset="100%" style="stop-color:#0f0f14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5b21b6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="zone-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(124,58,237,0.35)"/>
      <stop offset="100%" style="stop-color:rgba(124,58,237,0.15)"/>
    </linearGradient>
    <linearGradient id="zone-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(139,92,246,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(139,92,246,0.08)"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Browser window frame -->
  <rect x="40" y="28" width="560" height="304" fill="#0c0c10" stroke="rgba(124,58,237,0.25)" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="40" y="28" width="560" height="32" fill="#12121a"/>
  <rect x="48" y="36" width="544" height="16" fill="#1a1a24"/>
  <!-- Traffic lights / window controls -->
  <circle cx="60" cy="36" r="5" fill="rgba(124,58,237,0.4)"/>
  <circle cx="76" cy="36" r="5" fill="rgba(124,58,237,0.25)"/>
  <circle cx="92" cy="36" r="5" fill="rgba(124,58,237,0.25)"/>
  <!-- Address bar hint -->
  <rect x="112" y="34" width="180" height="10" fill="rgba(124,58,237,0.12)"/>
  <text x="122" y="42" font-family="system-ui,sans-serif" font-size="8" fill="rgba(167,139,250,0.5)">parametra.net</text>

  <!-- Main content area = urban plan view -->
  <g transform="translate(56 68)">
    <!-- Left sidebar - layers/tools -->
    <rect x="0" y="0" width="72" height="260" fill="#0e0e12" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
    <rect x="8" y="12" width="56" height="8" fill="rgba(124,58,237,0.2)"/>
    <rect x="8" y="28" width="40" height="6" fill="rgba(124,58,237,0.1)"/>
    <rect x="8" y="40" width="40" height="6" fill="rgba(124,58,237,0.1)"/>
    <rect x="8" y="52" width="40" height="6" fill="rgba(124,58,237,0.1)"/>
    <text x="12" y="82" font-family="system-ui,sans-serif" font-size="7" fill="rgba(167,139,250,0.4)" font-weight="600">LAYERS</text>
    <rect x="8" y="90" width="48" height="6" fill="rgba(124,58,237,0.08)"/>
    <rect x="8" y="100" width="48" height="6" fill="rgba(124,58,237,0.08)"/>
    <rect x="8" y="110" width="48" height="6" fill="rgba(124,58,237,0.08)"/>

    <!-- Map / plan area -->
    <rect x="80" y="0" width="432" height="260" fill="#08080c" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
    <!-- Grid (street grid) -->
    <g stroke="rgba(124,58,237,0.12)" stroke-width="0.5" fill="none">
      <line x1="80" y1="40" x2="512" y2="40"/>
      <line x1="80" y1="90" x2="512" y2="90"/>
      <line x1="80" y1="140" x2="512" y2="140"/>
      <line x1="80" y1="190" x2="512" y2="190"/>
      <line x1="80" y1="240" x2="512" y2="240"/>
      <line x1="160" y1="0" x2="160" y2="260"/>
      <line x1="240" y1="0" x2="240" y2="260"/>
      <line x1="320" y1="0" x2="320" y2="260"/>
      <line x1="400" y1="0" x2="400" y2="260"/>
      <line x1="480" y1="0" x2="480" y2="260"/>
    </g>
    <!-- Zone blocks (urban plan zones) -->
    <rect x="88" y="48" width="64" height="34" fill="url(#zone-a)" stroke="rgba(124,58,237,0.35)" stroke-width="1"/>
    <rect x="168" y="48" width="64" height="34" fill="url(#zone-b)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
    <rect x="248" y="48" width="64" height="34" fill="url(#zone-a)" stroke="rgba(124,58,237,0.35)" stroke-width="1"/>
    <rect x="328" y="48" width="64" height="34" fill="url(#zone-b)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
    <rect x="408" y="48" width="64" height="34" fill="url(#zone-a)" stroke="rgba(124,58,237,0.35)" stroke-width="1"/>
    <rect x="88" y="98" width="64" height="34" fill="url(#zone-b)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
    <rect x="168" y="98" width="64" height="34" fill="url(#zone-a)" stroke="rgba(124,58,237,0.35)" stroke-width="1"/>
    <rect x="248" y="98" width="64" height="34" fill="url(#zone-b)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
    <rect x="328" y="98" width="64" height="34" fill="url(#zone-a)" stroke="rgba(124,58,237,0.35)" stroke-width="1"/>
    <rect x="88" y="148" width="64" height="34" fill="url(#zone-a)" stroke="rgba(124,58,237,0.35)" stroke-width="1"/>
    <rect x="248" y="148" width="64" height="34" fill="url(#zone-b)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
    <rect x="408" y="148" width="64" height="34" fill="url(#zone-a)" stroke="rgba(124,58,237,0.35)" stroke-width="1"/>
    <!-- Zone labels -->
    <text x="108" y="68" font-family="system-ui,sans-serif" font-size="7" fill="rgba(167,139,250,0.6)" font-weight="600">R</text>
    <text x="188" y="68" font-family="system-ui,sans-serif" font-size="7" fill="rgba(167,139,250,0.6)" font-weight="600">C</text>
    <text x="268" y="68" font-family="system-ui,sans-serif" font-size="7" fill="rgba(167,139,250,0.6)" font-weight="600">R</text>
    <text x="348" y="68" font-family="system-ui,sans-serif" font-size="7" fill="rgba(167,139,250,0.6)" font-weight="600">M</text>
    <text x="428" y="68" font-family="system-ui,sans-serif" font-size="7" fill="rgba(167,139,250,0.6)" font-weight="600">R</text>
    <!-- Legend -->
    <rect x="520" y="8" width="80" height="72" fill="#0e0e12" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
    <text x="528" y="22" font-family="system-ui,sans-serif" font-size="6" fill="rgba(167,139,250,0.5)" font-weight="600">LEGEND</text>
    <rect x="528" y="28" width="10" height="8" fill="rgba(124,58,237,0.4)"/>
    <text x="542" y="35" font-family="system-ui,sans-serif" font-size="6" fill="rgba(167,139,250,0.5)">Residential</text>
    <rect x="528" y="42" width="10" height="8" fill="rgba(139,92,246,0.3)"/>
    <text x="542" y="49" font-family="system-ui,sans-serif" font-size="6" fill="rgba(167,139,250,0.5)">Commercial</text>
    <rect x="528" y="56" width="10" height="8" fill="rgba(124,58,237,0.25)"/>
    <text x="542" y="63" font-family="system-ui,sans-serif" font-size="6" fill="rgba(167,139,250,0.5)">Mixed use</text>
  </g>
</svg>
